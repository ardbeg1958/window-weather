<script>
(()=>{'use strict';
/* ===================== utilities ===================== */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mulc=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const rgb=(c)=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
const rgba=(c,a)=>'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a<0?0:a>1?1:a).toFixed(3)+')';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;               // runtime random (reseedable for debugging)
const rr=(a,b)=>a+(b-a)*R();
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
/* smooth 1D / 2D value noise */
const NT=new Float32Array(512);{const r=mulberry(77);for(let i=0;i<512;i++)NT[i]=r()}
function n1(x){const i=Math.floor(x),f=x-i,a=NT[i&511],b=NT[(i+1)&511],u=f*f*(3-2*f);return a+(b-a)*u}
function fbm1(x,o){let s=0,a=.5,t=0;for(let i=0;i<(o||4);i++){s+=a*n1(x);t+=a;x=x*2.03+17.3;a*=.5}return s/t}
function n2(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 const h=(a,b)=>{let k=Math.imul(a,374761393)+Math.imul(b,668265263)|0;k=Math.imul(k^(k>>>13),1274126177);k^=k>>>16;return NT[k&511]};
 const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);return lerp(lerp(a,b,u),lerp(c,d,u),v)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ===================== weather definitions ===================== */
// cover: cloud amount, gray: overcast greyness, gf: glass fog target, fog: outdoor mist, tod: canonical hour for manual mode
const WX={
 sunny:    {n:'晴れ',  cover:.16,gray:0,  rain:0, snow:0, fog:0,  wind:.25,gf:0,  frost:0,thunder:0,rays:1,  tod:11},
 cloudy:   {n:'曇り',  cover:.9, gray:.72,rain:0, snow:0, fog:.16,wind:.4, gf:.06,frost:0,thunder:0,rays:0,  tod:13.5},
 rain:     {n:'雨',    cover:1,  gray:.88,rain:.7,snow:0, fog:.25,wind:.5, gf:.78,frost:0,thunder:0,rays:0,  tod:14.5},
 thunder:  {n:'雷雨',  cover:1,  gray:1,  rain:1, snow:0, fog:.3, wind:.85,gf:.8,frost:0,thunder:1,rays:0,  tod:16},
 snow:     {n:'雪',    cover:1,  gray:.8, rain:0, snow:.85,fog:.3,wind:.25,gf:.62,frost:1,thunder:0,rays:0,  tod:10},
 fog:      {n:'霧',    cover:.9, gray:.62,rain:0, snow:0, fog:1,  wind:.1, gf:.7, frost:0,thunder:0,rays:0,  tod:7.4},
 sunset:   {n:'夕焼け',cover:.5, gray:.1, rain:0, snow:0, fog:0,  wind:.3, gf:0,  frost:0,thunder:0,rays:.6,tod:17.8},
 night:    {n:'夜',    cover:.14,gray:0,  rain:0, snow:0, fog:0,  wind:.15,gf:0,  frost:0,thunder:0,rays:0,  tod:23},
 nightrain:{n:'夜の雨',cover:1,  gray:.85,rain:.65,snow:0,fog:.2, wind:.45,gf:.75, frost:0,thunder:0,rays:0,  tod:23},
 nightsnow:{n:'夜の雪',cover:1,  gray:.75,rain:0, snow:.7,fog:.2, wind:.2, gf:.6, frost:1,thunder:0,rays:0,  tod:23.5}
};
const ORDER=['sunny','cloudy','rain','thunder','snow','fog','sunset','night','nightrain','nightsnow'];
const PKEYS=['cover','gray','rain','snow','fog','wind','gf','thunder','rays'];

/* ===================== sky key frames [top, mid, horizon] ===================== */
const SKYK=[
 [0,   [5,9,24],[10,18,42],[22,34,66]],
 [4.6, [5,9,24],[10,18,42],[22,34,66]],
 [5.6, [38,52,100],[122,102,134],[240,152,112]],
 [7,   [84,128,200],[170,190,216],[250,214,174]],
 [9,   [70,130,210],[140,186,230],[200,226,246]],
 [12,  [46,120,214],[108,170,236],[176,214,246]],
 [15.5,[56,124,208],[120,174,230],[192,218,240]],
 [17,  [76,108,190],[204,164,172],[255,192,124]],
 [17.9,[58,66,138],[206,112,118],[255,138,58]],
 [18.7,[36,40,102],[142,82,112],[240,112,72]],
 [19.5,[20,24,66],[62,50,92],[130,72,92]],
 [20.6,[8,12,34],[18,28,58],[34,48,86]],
 [24,  [5,9,24],[10,18,42],[22,34,66]]
];
function skyAt(h){h=((h%24)+24)%24;let i=0;while(i<SKYK.length-2&&h>=SKYK[i+1][0])i++;
 const a=SKYK[i],b=SKYK[i+1],t=(h-a[0])/(b[0]-a[0]),u=t*t*(3-2*t);
 return {top:mixc(a[1],b[1],u),mid:mixc(a[2],b[2],u),hor:mixc(a[3],b[3],u)}}

/* ===================== global state ===================== */
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const S={
 auto:store.get('ww_auto','1')==='1',
 weather:'sunny',todOverride:null,todOffset:0,
 tod:12,time:0,
 P:{cover:.16,gray:0,rain:0,snow:0,fog:0,wind:.25,gf:0,thunder:0,rays:1},
 frost:0,snowG:0,wet:0,
 nextAuto:60,labelT:0,
 flash:0,bolts:[],nextBolt:4,
 q:1,paused:false
};
const L={}; // per-frame light model
function realHour(){const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600}
function shortest(a,b){let d=((b-a)%24+36)%24-12;return d}
function allowedSet(h){
 if(h>=19.5||h<4.8)return['night','nightrain','nightsnow','fog','thunder','cloudy'];
 if(h>=16.6)return['sunset','cloudy','rain','thunder','fog'];
 if(h<7)return['fog','sunny','cloudy','rain'];
 return['sunny','cloudy','rain','thunder','snow','fog'];
}
function pickAuto(h,not){
 const w={};
 if(h>=19.5||h<4.8){w.night=5;w.nightrain=3;w.nightsnow=2;w.fog=1;w.thunder=1}
 else if(h>=16.6){w.sunset=6;w.cloudy=1.5;w.rain=2;w.fog=.7}
 else if(h<7){w.fog=3;w.sunny=3;w.cloudy=2}
 else{w.sunny=5;w.cloudy=2.5;w.rain=3;w.thunder=1.2;w.snow=2;w.fog=1.2}
 if(not)delete w[not];
 let t=0;for(const k in w)t+=w[k];let r=R()*t;for(const k in w){r-=w[k];if(r<=0)return k}
 return Object.keys(w)[0];
}
function nextWeather(){
 if(S.auto){const set=allowedSet(S.tod).filter(x=>ORDER.indexOf(x)>=0).sort((a,b)=>ORDER.indexOf(a)-ORDER.indexOf(b));
  let i=set.findIndex(k=>ORDER.indexOf(k)>ORDER.indexOf(S.weather));if(i<0)i=0;return set[i]}
 return ORDER[(ORDER.indexOf(S.weather)+1)%ORDER.length];
}

/* ===================== geometry ===================== */
let W=0,H=0,DPR=1;const SAFE={t:0,r:0,b:0,l:0};
const G={x:0,y:0,w:0,h:0}, FR={x:0,y:0,w:0,h:0,t:0}, SILL={y:0,d:0,x0:0,x1:0,th:0,base:0};
let sc=null,scx=null,SS=1,gw=0,gh=0,hy=0,un=1;
const LAY={};
const DEP=[3,6,10,16,26];        // parallax px per layer
const DAYC=[[132,150,182],[96,128,128],[78,114,90],[56,92,62],[42,74,50]];
const NIGHTC=[[34,46,82],[24,35,62],[17,27,47],[12,20,35],[8,14,24]];
const HZ=[.55,.38,.22,.1,0], SF=[.55,.8,.85,.9,.92];
const cloudMask=[],cloudSpr=[];
let glowSpr=null,flakeSpr=null,dropSpr=null,starList=[];

function ridgeArr(seed,base,amp,c,ridged,x0,x1,step){
 const n=Math.ceil((x1-x0)/step)+1,a=new Float32Array(n),f=c/gw;
 for(let i=0;i<n;i++){const x=x0+i*step;let v=fbm1(x*f+seed*31.7,4);v=clamp((v-.28)/.44,0,1);
  if(ridged){v=1-Math.abs(2*v-1);v=v*.55+v*v*.45;v=1-v}
  a[i]=base-amp*v}
 return a}
function arrPath(a,x0,step,bottom){const p=new Path2D();p.moveTo(x0,bottom);for(let i=0;i<a.length;i++)p.lineTo(x0+i*step,a[i]);p.lineTo(x0+(a.length-1)*step,bottom);p.closePath();return p}
function arrAt(a,x0,step,x){const f=(x-x0)/step,i=clamp(Math.floor(f),0,a.length-2);return a[i]+(a[i+1]-a[i])*clamp(f-i,0,1)}
function pine(p,x,y,s){const w=s*.32;p.moveTo(x,y-s);p.lineTo(x+w*.6,y-s*.68);p.lineTo(x+w*.3,y-s*.68);p.lineTo(x+w*.85,y-s*.36);p.lineTo(x+w*.45,y-s*.36);p.lineTo(x+w,y-s*.05);p.lineTo(x-w,y-s*.05);p.lineTo(x-w*.45,y-s*.36);p.lineTo(x-w*.85,y-s*.36);p.lineTo(x-w*.3,y-s*.68);p.lineTo(x-w*.6,y-s*.68);p.closePath();p.rect(x-s*.025,y-s*.06,s*.05,s*.1)}
function roundTree(p,x,y,s){const r=s*.28;p.moveTo(x+r,y-s*.62);p.arc(x,y-s*.62,r,0,7);p.moveTo(x+r*.8,y-s*.42);p.arc(x-r*.35,y-s*.42,r*.8,0,7);p.rect(x-s*.03,y-s*.4,s*.06,s*.42)}

function buildScenery(){
 const r=mulberry(20261028);
 const X0=-100,X1=gw+100,ST=5;
 LAY.x0=X0;LAY.st=ST;
 LAY.m0=ridgeArr(1.3,hy+.025*gh,.2*gh,2.2,true,X0,X1,ST);
 LAY.h1=ridgeArr(2.7,hy+.075*gh,.085*gh,3.4,false,X0,X1,ST);
 LAY.h2=ridgeArr(4.1,hy+.115*gh,.04*gh,2.6,false,X0,X1,ST);
 LAY.h3=ridgeArr(6.2,hy+.215*gh,.115*gh,2.9,false,X0,X1,ST);
 LAY.h4=ridgeArr(8.8,hy+.325*gh,.03*gh,3.5,false,X0,X1,ST);
 const B=gh+10;
 LAY.pm0=arrPath(LAY.m0,X0,ST,B);LAY.ph1=arrPath(LAY.h1,X0,ST,B);LAY.ph2=arrPath(LAY.h2,X0,ST,B);LAY.ph3=arrPath(LAY.h3,X0,ST,B);LAY.ph4=arrPath(LAY.h4,X0,ST,B);
 // small pines on hill1
 let p=new Path2D();for(let x=X0+10;x<X1-10;x+=(6+r()*9)*un){const s=(9+r()*13)*un;if(r()<.75)pine(p,x,arrAt(LAY.h1,X0,ST,x)+2*un,s)}LAY.t1=p;
 // medium trees on hill2 behind houses
 p=new Path2D();for(let x=X0+10;x<X1-10;x+=(14+r()*26)*un){const s=(14+r()*14)*un;const y=arrAt(LAY.h2,X0,ST,x)+3*un;if(r()<.5)pine(p,x,y,s);else roundTree(p,x,y,s)}LAY.t2=p;
 // trees on hill3
 const tp=new Path2D(),tr=new Path2D();LAY.treeList=[];
 for(let x=X0+20;x<X1-20;x+=(20+r()*52)*un){const s=(26+r()*34)*un;const y=arrAt(LAY.h3,X0,ST,x)+4*un;if(y<hy+.14*gh)continue;if(r()<.55)pine(tp,x,y,s);else roundTree(tr,x,y,s)}
 LAY.t3p=tp;LAY.t3r=tr;
 // town: houses sit behind hill2's crest
 const hb=new Path2D(),hr=new Path2D(),wins=[[],[],[],[]],dw=new Path2D();LAY.houses=[];
 const clusters=[[.32,.14],[.64,.2],[.86,.1]];
 const dens=x=>{let d=.08;for(const c of clusters){const t=(x/gw-c[0])/c[1];d+=Math.exp(-t*t)}return d};
 for(let x=gw*.02;x<gw*.98;){const d=dens(x);
  if(r()<d*.78+.05){const w=(11+r()*15)*un,h=(8+r()*13)*un;const y=arrAt(LAY.h2,X0,ST,x+w/2)+7*un;const yb=y,yt=yb-h;
   hb.rect(x,yt,w,h+12*un);
   const rh=w*(.28+r()*.2);const ov=2*un;
   if(r()<.7){hr.moveTo(x-ov,yt);hr.lineTo(x+w/2,yt-rh);hr.lineTo(x+w+ov,yt);hr.closePath()}else{hr.rect(x-ov,yt-3*un,w+2*ov,3*un)}
   if(r()<.45)hb.rect(x+w*.7,yt-rh*.9-3*un,2.2*un,5*un);
   const nw=w>18*un?2:1;
   for(let k=0;k<nw;k++){const wx=x+w*(nw===1?.5:(k?.7:.3))-1.4*un,wy=yt+h*.35,ww=2.8*un,wh=3.2*un;const g=Math.floor(r()*4);wins[g].push([wx,wy,ww,wh]);dw.rect(wx,wy,ww,wh);
    if(h>14*un&&r()<.6){const g2=Math.floor(r()*4);wins[g2].push([wx,wy+h*.34,ww,wh]);dw.rect(wx,wy+h*.34,ww,wh)}}
   LAY.houses.push([x,yt,w,h]);
   x+=w+(2+r()*8)*un}else x+=(6+r()*14)*un}
 // church tower
 {const tx=gw*.585,ty=arrAt(LAY.h2,X0,ST,tx)+8*un,tw=8*un,th=44*un;hb.rect(tx-tw/2,ty-th,tw,th+12*un);
  hr.moveTo(tx-tw*.7,ty-th);hr.lineTo(tx,ty-th-24*un);hr.lineTo(tx+tw*.7,ty-th);hr.closePath();
  LAY.clock=[tx,ty-th*.72,2.6*un];wins[3].push([tx-1.2*un,ty-th*.45,2.4*un,4*un]);dw.rect(tx-1.2*un,ty-th*.45,2.4*un,4*un)}
 LAY.hb=hb;LAY.hr=hr;LAY.wins=wins;LAY.dw=dw;
 LAY.winGlow=[];wins.forEach((g,gi)=>g.forEach((w,i)=>{if(i%3===0)LAY.winGlow.push([w[0]+w[2]/2,w[1]+w[3]/2,gi])}));
 // track
 LAY.ty=hy+.132*gh;
 LAY.bands=[];for(let k=1;k<=5;k++){const a=new Float32Array(LAY.h3.length);const off=(k*.04)*gh;for(let i=0;i<a.length;i++)a[i]=LAY.h3[i]+off+(n1(i*.07+k*5)-.5)*.02*gh;LAY.bands.push({p:arrPath(a,X0,ST,B),a})}
 p=new Path2D();for(let x=X0+5;x<X1;x+=(7+r()*12)*un){const y=arrAt(LAY.h4,X0,ST,x)+2*un,rad=(3+r()*5)*un;p.moveTo(x+rad,y);p.arc(x,y,rad,Math.PI,0);p.lineTo(x+rad,y+2*un);p.lineTo(x-rad,y+2*un);p.closePath()}LAY.shrubs=p;
 p=new Path2D();for(let x=X0;x<X1;x+=12*un){const y=hy+.395*gh;p.rect(x,y-8*un-(x%3),1.6*un,9*un)}LAY.fence=p;
 LAY.townGlow=clusters.map(c=>c[0]*gw);
 // lamp post & near tree
 LAY.lamp={x:gw*.26,y:gh*.9,h:gh*.43};
 LAY.tree={x:gw*.985,y:gh*.98,s:Math.min(gh*.82,gw*.6)};
 LAY.puddles=[];for(let i=0;i<5;i++)LAY.puddles.push([gw*(.1+r()*.8),gh*(.86+r()*.1),(30+r()*50)*un,(4+r()*4)*un]);
 // stars
 starList=[];for(let i=0;i<260;i++)starList.push([r()*gw,Math.pow(r(),1.4)*hy*.95,r()*1.1+.35,r()*6.28,.4+r()*1.8]);
 // clouds
 S.clouds=[];for(let i=0;i<18;i++){S.clouds.push({x:r()*1.5-.2,y:.04+r()*.95,s:.6+r()*.9,k:Math.floor(r()*4),thr:i/18,sp:.6+r()*.8,a:.7+r()*.3,flip:r()<.5?-1:1})}
}

/* ---------- cached sprites ---------- */
function buildSprites(){
 if(cloudMask.length)return;
 const r=mulberry(99);
 for(let k=0;k<4;k++){
  const m=mkCanvas(360,150),c=m.getContext('2d');const n=9+k*2;
  for(let i=0;i<n;i++){const t=i/(n-1);const x=50+t*260+(r()-.5)*20;const rad=(22+Math.sin(t*3.14)*34)*(0.7+r()*.55);const y=104-rad*(.35+r()*.5);
   const g=c.createRadialGradient(x,y,rad*.05,x,y,rad);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.55,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
   c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,7);c.fill()}
  // flat-ish base

 // fireflies

 if(L.fireA>.02)for(const q of S.flies){q.a+=(R()-.5)*3*dt;q.vx=lerp(q.vx,Math.cos(q.a)*q.sp*12*un,.02);q.vy=lerp(q.vy,Math.sin(q.a)*q.sp*7*un,.02);q.x+=q.vx*dt;q.y+=q.vy*dt;q.ph+=dt*q.sp*1.3;

 // birds

  S.flocks.push({x:dir>0?-30*un:gw+30*un,y:hy*(.22+R()*.4),vx:dir*(20+R()*14)*un,vy:-2*un*R(),t:0,b:b.map(q=>[q[0]*dir,q[1],q[2]])})}

const DR=[];let DRMAX=100,DK=1;
const CELL=4;let fmw=0,fmh=0,fogF=null,fogN=null,fmC=null,fmX=null,fmImg=null,fogComp=null,fogCX=null,blurC=null,blurS=null,frostC=null,fogActive=false;
function buildGlass(mob){
 DRMAX=mob?80:170;DR.length=0;DK=clamp(un*1.02,.55,1.35);
 fmw=Math.ceil(gw/CELL);fmh=Math.ceil(gh/CELL);
 fogF=new Float32Array(fmw*fmh);fogN=new Float32Array(fmw*fmh);
 for(let y=0;y<fmh;y++)for(let x=0;x<fmw;x++){
  const px=x*CELL,py=y*CELL;let n=.55+.6*n2(x*.13,y*.13)+.25*n2(x*.4+9,y*.4+4);
  const ed=Math.min(px,gw-px,py)/Math.min(gw,gh),bt=(gh-py)/gh;
  n*=1+.7*Math.exp(-ed*9)+.55*Math.exp(-bt*5);fogN[y*fmw+x]=n}
 fmC=mkCanvas(fmw,fmh);fmX=fmC.getContext('2d');fmImg=fmX.createImageData(fmw,fmh);for(let i=0;i<fmw*fmh;i++){const o=i*4;fmImg.data[o]=fmImg.data[o+1]=fmImg.data[o+2]=255}
 fogComp=mkCanvas(gw*.5,gh*.5);fogCX=fogComp.getContext('2d');
 blurS=[2,4,8].map(k=>{const c=mkCanvas(gw*SS/k,gh*SS/k);return{c,x:c.getContext('2d')}});blurC=blurS[2].c;

}
function buildFrost(){
 const k=.6,fw=Math.ceil(gw*k),fh=Math.ceil(gh*k);frostC=mkCanvas(fw,fh);const c=frostC.getContext('2d');c.scale(k,k);
 const r=mulberry(4242),m=Math.min(gw,gh);
 const edge=(x0,y0,x1,y1,ex)=>{const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'rgba(225,238,252,.4)');g.addColorStop(.35,'rgba(225,238,252,.14)');g.addColorStop(1,'rgba(225,238,252,0)');c.fillStyle=g;c.fillRect(0,0,gw,gh)};
 const ex=.11*m;edge(0,0,ex,0);edge(gw,0,gw-ex,0);edge(0,0,0,ex);edge(0,gh,0,gh-ex);
 c.lineCap='round';
 const branch=(x,y,a,len,w,d)=>{if(len<3||d>5)return;const x2=x+Math.cos(a)*len,y2=y+Math.sin(a)*len;c.strokeStyle='rgba(240,248,255,'+(.1+.3*Math.min(1,w/1.6)).toFixed(2)+')';c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.stroke();
  const n=2+Math.floor(r()*2);for(let i=0;i<n;i++){const t=.35+.6*r();const bx=x+(x2-x)*t,by=y+(y2-y)*t;const s=r()<.5?-1:1;branch(bx,by,a+s*(.6+r()*.5),len*(.38+r()*.25),w*.7,d+1)}
  branch(x2,y2,a+(r()-.5)*.5,len*.55,w*.8,d+1)};
 const seeds=(x,y,ax,ay)=>{const a=Math.atan2(ay,ax)+(r()-.5)*.9;branch(x,y,a,(.025+r()*.09*(r()<.25?1.6:1))*m,1.25*(.6+r()*.6),0)};
 const per=Math.floor((gw+gh)/17);
 for(let i=0;i<per;i++){seeds(r()*gw,0,0,1);seeds(r()*gw,gh,0,-1)}
 for(let i=0;i<per*.7;i++){seeds(0,r()*gh,1,0);seeds(gw,r()*gh,-1,0)}
 for(let i=0;i<200;i++){const x=r()*gw,y=r()*gh;const ed=Math.min(x,gw-x,y,gh-y)/m;if(r()<Math.exp(-ed*8)){c.fillStyle='rgba(255,255,255,'+(.2+r()*.5).toFixed(2)+')';c.beginPath();c.arc(x,y,.6+r()*1.4,0,7);c.fill()}}
}
function fogClear(x,y,rad,str){
 const cx0=Math.max(0,Math.floor((x-rad)/CELL)),cx1=Math.min(fmw-1,Math.ceil((x+rad)/CELL)),cy0=Math.max(0,Math.floor((y-rad)/CELL)),cy1=Math.min(fmh-1,Math.ceil((y+rad)/CELL));
 for(let j=cy0;j<=cy1;j++)for(let i=cx0;i<=cx1;i++){const dx=(i+.5)*CELL-x,dy=(j+.5)*CELL-y,d=Math.sqrt(dx*dx+dy*dy)/rad;if(d>=1)continue;
  const k=(d<.55?0:(d-.55)/.45);const idx=j*fmw+i;const nv=fogF[idx]*(1-str)+fogF[idx]*str*k*k;if(nv<fogF[idx])fogF[idx]=nv}
}
function wipe(x,y,x2,y2){ // glass coords
 const rad=(IS_TOUCH?30:26)*Math.max(.8,un);
 const dx=x2-x,dy=y2-y,d=Math.hypot(dx,dy),n=Math.max(1,Math.ceil(d/(rad*.3)));
 for(let i=0;i<=n;i++){const px=x+dx*i/n,py=y+dy*i/n;fogClear(px,py,rad,1);
  for(let j=DR.length-1;j>=0;j--){const o=DR[j],ddx=o.x-px,ddy=o.y-py;if(ddx*ddx+ddy*ddy<rad*rad*.8){if(o.r<3.4*DK){DR.splice(j,1)}else if(!o.sl){o.sl=true;o.th=0}}}}

}
function spawnDrop(){
 const P=S.P;const r0=Math.pow(R(),2.2);const r=(1.1+r0*4.4)*DK;
 DR.push({x:R()*gw,y:R()*gh*.97,r,sl:false,th:(5.4+R()*2.4)*DK,v:0,st:0,stall:false,td:0,g:.6+R()*.9,age:0});
}
function updateDrops(dt){
 const P=S.P;const wetIn=P.rain+P.gf*.12+P.fog*.1;
 // spawn
 const sr=(P.rain*34+P.fog*1.6+P.gf*1.5)*(IS_TOUCH?.75:1)*S.q;
 let acc=(updateDrops.acc||0)+sr*dt;while(acc>=1){acc--;if(DR.length<DRMAX)spawnDrop();else{for(let i=0;i<DR.length;i++)if(!DR[i].sl&&DR[i].r<2){DR.splice(i,1);break}}}updateDrops.acc=acc;
  let slideN=0;for(let i=0;i<DR.length;i++)if(DR[i].sl)slideN++;

 for(let i=DR.length-1;i>=0;i--){const d=DR[i];d.age+=dt;
  if(!d.sl){
   d.r+=P.rain*.24*d.g*dt*DK*(1-d.r/(9*DK));
   if(d.r>d.th&&slideN<(IS_TOUCH?6:10)){d.sl=true}
   if(dry||(P.rain<.1&&P.fog<.3&&P.gf<.2&&d.r<3*DK)){d.r-=dt*(dry?.08:.015)*DK}

 const df=shortest(S.tod,target);let st=df*(1-Math.exp(-dt/(S.auto?1:2.2)));const mx=4*dt;st=clamp(st,-mx,mx);S.tod=((S.tod+st)%24+24)%24;

 if(S.P.snow>.2)S.snowG=Math.min(1,S.snowG+dt*S.P.snow*.014);else S.snowG=Math.max(0,S.snowG-dt*(.004+.01*L.L));
